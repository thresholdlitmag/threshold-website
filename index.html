<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threshold — Literary &amp; Arts Magazine</title>
    <meta
      name="description"
      content="Threshold is the student literary and arts magazine of Thomas Jefferson High School — poetry, prose, visual art, and music, published since 1986."
    />
    <!-- Tints the browser chrome on mobile to match the paper. -->
    <meta name="theme-color" content="#f4f3ed" />
    <meta name="color-scheme" content="light" />

    <!-- How the site looks when someone shares a link to it: without
         these, a paste into Instagram, Discord or a group chat renders as
         a bare URL. -->
    <meta property="og:type" content="website" />
    <meta
      property="og:site_name"
      content="Threshold Literary &amp; Arts Magazine"
    />
    <meta property="og:title" content="Threshold — Literary &amp; Arts Magazine" />
    <meta
      property="og:description"
      content="Poetry, prose, visual art, and music by student writers and artists. Read the gallery, meet the editors, and send us your work."
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Threshold — Literary &amp; Arts Magazine"
    />
    <meta
      name="twitter:description"
      content="Poetry, prose, visual art, and music by student writers and artists."
    />

    <!--
      The magazine's logo, resized from the 10009px master in public/.
      A browser picks the closest size and scales down, so serving 32 and
      192 separately keeps the tab icon crisp without making every
      visitor download a print-resolution PNG.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./favicon-192.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
